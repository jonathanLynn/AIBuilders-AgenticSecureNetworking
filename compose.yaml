services:
  lab:
    build:
      context: .
      args:
        PI_VERSION: ${PI_VERSION:-0.87.1}
        MCP_SCANNER_VERSION: ${MCP_SCANNER_VERSION:-4.7.5}
    image: agent-foundry-lab:local
    environment:
      LAB_ACCESS_CODE: ${LAB_ACCESS_CODE:-agent-team-2026}
      LAB_MODE: ${LAB_MODE:-demo}
    ports:
      - "${LAB_PORT:-8080}:8080"
    volumes:
      - lab-progress:/opt/agent-foundry/data/progress
      - lab-reports:/opt/agent-foundry/reports
      - lab-home:/home/learner
      - lab-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped

volumes:
  lab-progress:
  lab-reports:
  lab-home:
  lab-workspace:
